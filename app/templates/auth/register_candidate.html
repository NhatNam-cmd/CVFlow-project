{% extends "layouts/auth_layout.html" %}

{% block title %}Đăng Ký Ứng Viên - CVFlow{% endblock %}

{% block auth_content %}
    <div class="card auth-card shadow border-0">
        <div class="card-header bg-success text-white text-center py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill"></i> Tạo Hồ Sơ Ứng Viên</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth.register_candidate') }}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và Tên</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@gmail.com" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nhập lại mật khẩu</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" required>
                    <label class="form-check-label small text-muted">
                        Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a>.
                    </label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg fw-bold">Đăng Ký Ngay</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">Đã có tài khoản?</span>
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold ms-1">Đăng nhập</a>
            </div>
        </div>
    </div>
{% endblock %}
