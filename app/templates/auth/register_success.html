{% extends "layouts/auth_layout.html" %}

{% block title %}Đăng Ký Thành Công{% endblock %}

{% block auth_content %}
    <div class="card auth-card shadow-sm text-center p-5">
        <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        </div>
        <h2 class="fw-bold text-dark">Tài khoản đã được tạo!</h2>
        <p class="text-muted lead mb-4">
            Cảm ơn bạn đã tham gia CVFlow.<br>
            Vui lòng kiểm tra hộp thư email để kích hoạt tài khoản.
        </p>

        <div class="d-grid gap-2 col-8 mx-auto">
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                Đến trang Đăng nhập
            </a>
        </div>
    </div>
{% endblock %}
