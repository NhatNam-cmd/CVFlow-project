{% extends "layouts/auth_layout.html" %}

{% block title %}Đăng Nhập - CVFlow{% endblock %}

{% block auth_content %}
    <div class="card auth-card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Chào mừng trở lại!</h3>
                <p class="text-muted">Đăng nhập để tiếp tục hành trình sự nghiệp của bạn.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label small" for="remember">Ghi nhớ đăng nhập</label>
                    </div>
                    <a href="#" class="small text-decoration-none">Quên mật khẩu?</a>
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                        Đăng Nhập <i class="bi bi-arrow-right-short"></i>
                    </button>
                </div>
            </form>

            <div class="text-center border-top pt-3">
                <p class="small text-muted mb-2">Bạn chưa có tài khoản?</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('auth.register_candidate') }}" class="btn btn-outline-success btn-sm fw-medium">
                        <i class="bi bi-person"></i> Ứng viên
                    </a>
                    <a href="{{ url_for('auth.register_hr') }}" class="btn btn-outline-warning text-dark btn-sm fw-medium">
                        <i class="bi bi-briefcase"></i> Nhà tuyển dụng
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
