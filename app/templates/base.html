{# app/templates/base.html - Base template dùng chung #}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CVFlow{% endblock %}</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      /* Inline CSS chung (không tách file) */
      :root{
        --brand:#0d6efd;
        --muted:#6c757d;
      }
      body{ background:#f7f9fc; color:#212529; }
      .navbar-brand { font-weight:700; }
      .job-card { transition: box-shadow .15s ease; border-radius:8px; }
      .job-card:hover { box-shadow: 0 6px 18px rgba(13,110,253,0.12); transform: translateY(-2px); }
      .tag { display:inline-block; padding:4px 8px; border-radius:999px; background:#eef4ff; color:var(--brand); font-size:0.85rem; margin-right:6px; margin-bottom:6px; }
      footer { padding:24px 0; color:var(--muted); font-size:0.9rem; }
      .container-xl { max-width:1100px; }
      .admin-badge { background:#0b5ed7; color:white; padding:4px 8px; border-radius:6px; font-weight:600; }
      /* Responsive adjustments */
      @media (max-width:576px){
        .job-card { padding:12px; }
      }
    </style>

    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
      <div class="container-xl">
        <a class="navbar-brand" href="/">CVFlow</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Jobs</a></li>
            <li class="nav-item"><a class="nav-link" href="/apply">Apply</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="mb-5">
      <div class="container-xl">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="bg-white border-top">
      <div class="container-xl d-flex justify-content-between align-items-center">
        <div>© CVFlow — Hệ thống theo dõi ứng viên (ATS) — MVP</div>
        <div class="text-end small text-muted">Minimal UI</div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
