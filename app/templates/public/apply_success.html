{% extends "layouts/base.html" %}

{% block title %}Nộp đơn thành công!{% endblock %}

{% block content %}
    <div class="container py-5 text-center">
        <div class="mb-4">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
            <div class="mt-2"><i class="bi bi-check-circle-fill text-success fs-1"></i></div>
        </div>

        <h2 class="fw-bold mb-3">Hồ sơ đã được gửi thành công!</h2>
        <p class="lead text-muted mb-5">
            Hệ thống AI đang chấm điểm hồ sơ của bạn cho vị trí này.<br>
            Bạn có thể theo dõi kết quả trong Dashboard.
        </p>

        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('public.index') }}" class="btn btn-outline-secondary">Về Trang chủ</a>
            <a href="{{ url_for('candidate.job_manager') }}" class="btn btn-primary fw-bold px-4">
                <i class="bi bi-briefcase"></i> Theo dõi Đơn hàng
            </a>
        </div>
    </div>
{% endblock %}
