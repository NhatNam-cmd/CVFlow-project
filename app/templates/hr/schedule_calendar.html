{% extends "layouts/dashboard_layout.html" %}

{% block title %}Lịch Phỏng Vấn - CVFlow{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 mb-0">Lịch Phỏng Vấn</h2>
            <p class="text-muted small mb-0">Quản lý thời gian biểu phỏng vấn của bạn.</p>
        </div>
        <div>
            <a href="{{ url_for('hr.candidate_list') }}" class="btn btn-outline-secondary btn-sm me-2">
                <i class="bi bi-kanban"></i> Quay lại Kanban
            </a>
            <button class="btn btn-warning fw-bold shadow-sm" onclick="calendar.today()">
                Hôm nay
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div id='calendar' style="min-height: 700px;"></div>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            // Dữ liệu từ Backend truyền sang (Jinja2 render thành JSON string)
            var interviewEvents = {{ events|tojson }};

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth', // Mặc định xem theo tháng
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
                },
                locale: 'vi', // Tiếng Việt (FullCalendar tự hỗ trợ cơ bản)
                buttonText: {
                    today: 'Hôm nay',
                    month: 'Tháng',
                    week: 'Tuần',
                    day: 'Ngày',
                    list: 'Danh sách'
                },
                themeSystem: 'bootstrap5',
                height: 'auto',
                navLinks: true, // Cho phép bấm vào ngày/tuần
                editable: false, // Không cho kéo thả sửa lịch (chỉ xem)
                dayMaxEvents: true, // Nếu nhiều lịch quá thì hiện nút "Xem thêm"

                events: interviewEvents, // Nạp dữ liệu vào đây

                // Tùy chỉnh hiển thị sự kiện
                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    meridiem: false,
                    hour12: false
                },

                // Khi bấm vào sự kiện
                eventClick: function(info) {
                    if (info.event.url) {
                        // Mở link (trang chi tiết ứng viên)
                        // info.jsEvent.preventDefault(); // Nếu muốn mở modal thì dùng cái này chặn link
                        // window.open(info.event.url);
                    }
                }
            });

            calendar.render();

            // Fix lỗi render nếu sidebar đang đóng/mở
            setTimeout(function() {
                calendar.updateSize();
            }, 200);
        });
    </script>

    <style>
        /* Tùy chỉnh CSS nhỏ cho lịch đẹp hơn */
        .fc-event {
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85em;
            padding: 2px;
        }
        .fc-day-today {
            background-color: rgba(255, 193, 7, 0.05) !important;
        }
        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: bold;
        }
        .fc-button-primary {
            background-color: #0d6efd !important;
            border-color: #0d6efd !important;
        }
        .fc-button-active {
            background-color: #0a58ca !important;
        }
    </style>
{% endblock %}
